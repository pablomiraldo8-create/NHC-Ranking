<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ranking CS2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0e10; --panel:#16181c; --panel2:#1d2026; --line:#2a2e36;
  --text:#eceef2; --muted:#8b919c; --accent:#ff5500;
  --win:#3ecf6e; --loss:#ff4d5e;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:15px}
.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{font-family:Rajdhani,sans-serif;font-size:30px;margin:0;letter-spacing:.5px}
h1 span{color:var(--accent)}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.tabs{display:flex;gap:6px;background:var(--panel);padding:4px;border-radius:10px}
.tab{background:none;border:0;color:var(--muted);font:600 15px Rajdhani,sans-serif;letter-spacing:.5px;padding:8px 16px;border-radius:7px;cursor:pointer}
.tab.on{background:var(--accent);color:#fff}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:7px 12px;border-radius:8px;cursor:pointer;font:500 13px Inter,sans-serif}
.btn:hover{border-color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.note{padding:14px 16px;margin-bottom:14px;font-size:14px;line-height:1.5}
.note.warn{border-color:#6b4a1a;background:#1f1912}
.note pre{background:var(--bg);padding:10px;border-radius:8px;overflow:auto;font-size:12px;white-space:pre-wrap;word-break:break-all}
table{width:100%;border-collapse:collapse}
th{font:600 12px Inter,sans-serif;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;text-align:right;padding:12px 10px;border-bottom:1px solid var(--line)}
td{padding:11px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:nth-child(1),td:nth-child(1),th:nth-child(2),td:nth-child(2){text-align:left}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--panel2)}
.pos{font:700 20px Rajdhani,sans-serif;color:var(--muted);width:36px}
tr:nth-child(1) .pos{color:#ffc93c} tr:nth-child(2) .pos{color:#c9d1db} tr:nth-child(3) .pos{color:#d58a4a}
.who{display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;border-radius:50%;background:var(--panel2);object-fit:cover;flex:none}
.nick{font-weight:600}
.lvl{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;font:700 13px Rajdhani,sans-serif;border:2px solid currentColor}
.gain{font:700 18px Rajdhani,sans-serif}
.pos-g{color:var(--win)} .neg-g{color:var(--loss)} .zero-g{color:var(--muted)}
.form{display:inline-flex;gap:3px}
.form i{width:8px;height:16px;border-radius:2px;display:block}
.form .w{background:var(--win)} .form .l{background:var(--loss)}
.scroll{overflow-x:auto}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:5px 12px 5px 5px;border-radius:30px;cursor:pointer;font:600 14px Inter,sans-serif}
.chip img{width:26px;height:26px;border-radius:50%}
.chip.on{border-color:var(--accent);background:#2a1a10}
.phead{display:flex;align-items:center;gap:16px;padding:18px;margin-bottom:14px;flex-wrap:wrap}
.phead .av{width:64px;height:64px}
.phead h2{margin:0;font:700 28px Rajdhani,sans-serif}
.phead a{color:var(--accent);font-size:13px;text-decoration:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.stat{padding:14px}
.stat b{display:block;font:700 26px Rajdhani,sans-serif}
.stat span{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.4px}
h3{font:700 18px Rajdhani,sans-serif;letter-spacing:.5px;margin:22px 0 10px}
.res{font-weight:700} .res.w{color:var(--win)} .res.l{color:var(--loss)}
td a{color:var(--text);text-decoration:none} td a:hover{color:var(--accent)}
.bar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;width:80px;display:inline-block;vertical-align:middle;margin-left:8px}
.bar i{display:block;height:100%;background:var(--accent)}
.loading{padding:40px;text-align:center;color:var(--muted)}
.err{color:var(--loss);font-size:13px}
.foot{color:var(--muted);font-size:12px;margin-top:18px;text-align:center}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{background:none;border:0;color:var(--muted);font:500 13px Inter,sans-serif;padding:6px 12px;border-radius:6px;cursor:pointer}
.seg button.on{background:var(--panel2);color:var(--text)}
th.sort{cursor:pointer;user-select:none} th.sort:hover{color:var(--text)} th.sort.on{color:var(--accent)}
td.best{color:var(--win);font-weight:700}
td.worst{color:var(--loss);font-weight:700}
.secrow{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.secrow h3{margin-bottom:10px}
.ppl{display:flex;gap:-4px}
.ppl img{width:24px;height:24px;border-radius:50%;border:2px solid var(--panel);margin-left:-6px;background:var(--panel2)}
.ppl img:first-child{margin-left:0}
.tag{font-size:12px;color:var(--muted)}
@media (max-width:640px){
  .hide-m{display:none}
  td,th{padding:10px 6px}
  h1{font-size:26px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>RANKING <span>CS2</span></h1>
      <div class="sub" id="sub">ELO ganado en FACEIT</div>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <div class="tabs">
        <button class="tab on" data-t="avg">Promedios</button>
        <button class="tab" data-t="rank">Ranking ELO</button>
        <button class="tab" data-t="players">Jugadores</button>
      </div>
      <button class="btn" id="reload" title="Actualizar">↻</button>
    </div>
  </header>

  <div id="notes"></div>
  <section id="avg"><div class="loading">Cargando datos de FACEIT…</div></section>
  <section id="rank" hidden></section>
  <section id="players" hidden></section>
  <div class="foot" id="foot"></div>
</div>

<script>
/* ================= CONFIGURACIÓN ================= */
const API_KEY = "0de574d5-e0ec-4ea8-a57f-a0aa2b107c01";
const NICKS = ["xuRUx","C3BO","fakensx","jajajja","tongalp","Tr4mbolikO","AgsSssSs2","d1uzzZ","gtNNNNN"];
// Inicio del ranking (hora de Uruguay)
const START = new Date("2026-10-15T15:00:00-03:00");
// ELO de cada jugador al inicio. Se completa una sola vez.
const BASELINE = {
  "AgsSssSs2": 1864, "fakensx": 1638, "jajajja": 1618, "C3BO": 1333,
  "xuRUx": 1313, "gtNNNNN": 1207, "d1uzzZ": 1065, "tongalp": 1059,
};
/* ================================================= */

const API = "https://open.faceit.com/data/v4";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const n = parseFloat(String(v ?? "").replace(",", ".")); return isNaN(n) ? null : n; };
const fmt = (v, d=0) => v == null ? "–" : Number(v).toFixed(d);
const LVL_COLORS = ["#eee","#eee","#1ce400","#1ce400","#ffc800","#ffc800","#ffc800","#ffc800","#ff6309","#ff6309","#fe1f00"];
const lvl = l => l ? `<span class="lvl" style="color:${LVL_COLORS[l]||"#eee"}">${l}</span>` : "";
const AV_FALLBACK = "data:image/svg+xml;utf8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><rect width="40" height="40" fill="#1d2026"/><circle cx="20" cy="15" r="7" fill="#555"/><rect x="8" y="25" width="24" height="12" rx="6" fill="#555"/></svg>');

async function api(path){
  const r = await fetch(API + path, { headers: { Authorization: "Bearer " + API_KEY } });
  if (!r.ok) throw new Error(r.status === 404 ? "no encontrado" : r.status === 401 || r.status === 403 ? "llave inválida" : "error " + r.status);
  return r.json();
}

let players = [];
let selected = null;

async function loadPlayer(nick){
  const p = { nick, error: null };
  try {
    const info = await api("/players?nickname=" + encodeURIComponent(nick) + "&game=cs2");
    p.id = info.player_id;
    p.nick = info.nickname || nick;
    p.avatar = info.avatar || "";
    p.country = info.country;
    const g = (info.games && info.games.cs2) || {};
    p.elo = num(g.faceit_elo);
    p.level = num(g.skill_level);
    const [life, hist] = await Promise.all([
      api(`/players/${p.id}/stats/cs2`).catch(() => null),
      api(`/players/${p.id}/games/cs2/stats?limit=100`).catch(() => null)
    ]);
    const L = (life && life.lifetime) || {};
    p.life = {
      matches: num(L["Matches"]), winrate: num(L["Win Rate %"]),
      kd: num(L["Average K/D Ratio"]), hs: num(L["Average Headshots %"]),
      streak: num(L["Current Win Streak"]), longest: num(L["Longest Win Streak"]),
    };
    p.maps = ((life && life.segments) || []).filter(s => (s.type || "").toLowerCase() === "map").map(s => ({
      name: (s.label || "").replace(/^de_/, ""), img: s.img_small,
      matches: num(s.stats["Matches"]), winrate: num(s.stats["Win Rate %"]), kd: num(s.stats["Average K/D Ratio"])
    })).sort((a,b) => (b.matches||0) - (a.matches||0));
    p.matches = ((hist && hist.items) || []).map(it => {
      const s = it.stats || {};
      let t = num(s["Match Finished At"]) || num(s["Updated At"]) || Date.parse(s["Created At"]) || null;
      if (t && t < 1e12) t *= 1000;
      return {
        id: s["Match Id"], map: (s["Map"] || "").replace(/^de_/, ""), win: String(s["Result"]) === "1",
        score: s["Score"] || "", k: num(s["Kills"]), d: num(s["Deaths"]), a: num(s["Assists"]),
        kd: num(s["K/D Ratio"]), kr: num(s["K/R Ratio"]), hs: num(s["Headshots %"]), adr: num(s["ADR"]), mvp: num(s["MVPs"]), t
      };
    });
    const since = p.matches.filter(m => m.t && m.t >= START.getTime());
    p.since = {
      n: since.length, w: since.filter(m => m.win).length,
      kd: avg(since.map(m => m.kd)), hs: avg(since.map(m => m.hs)), adr: avg(since.map(m => m.adr))
    };
    const last20 = p.matches.slice(0, 20);
    p.recent = { adr: avg(last20.map(m => m.adr)), kd: avg(last20.map(m => m.kd)), hs: avg(last20.map(m => m.hs)) };
    p.gain = BASELINE[nick] != null && p.elo != null ? p.elo - BASELINE[nick] : null;
  } catch (e) { p.error = e.message; }
  return p;
}
function avg(a){ a = a.filter(x => x != null); return a.length ? a.reduce((s,x)=>s+x,0)/a.length : null; }

async function loadAll(){
  $("#avg").innerHTML = $("#rank").innerHTML = '<div class="loading">Cargando datos de FACEIT…</div>';
  players = await Promise.all(NICKS.map(loadPlayer));
  players.sort((a,b) => (b.gain ?? -1e9) - (a.gain ?? -1e9) || (b.elo ?? 0) - (a.elo ?? 0));
  if (!selected || !players.find(p => p.nick === selected)) selected = (players.find(p => !p.error) || {}).nick;
  if (avgScope == null) avgScope = players.some(p => !p.error && p.since.n >= 3) ? "since" : "recent";
  renderNotes(); renderAvg(); renderRank(); renderPlayers();
  $("#foot").textContent = "Actualizado " + new Date().toLocaleString("es-UY", {dateStyle:"short", timeStyle:"short"}) + " · datos de FACEIT";
}

function renderNotes(){
  $("#sub").textContent = "Estadísticas FACEIT del grupo desde el " + START.toLocaleDateString("es-UY", {day:"numeric", month:"long"});
}

/* ---------- Pestaña PROMEDIOS ---------- */
let avgScope = null;            // equipo: "since" = desde hoy, "recent" = histórico
const sorts = { hist: { key: "kd", dir: -1 }, since: { key: "kd", dir: -1 } };
const AVG_COLS = [
  ["n", "Partidas", 0], ["wr", "% Vic.", 0], ["kd", "K/D", 2], ["kr", "K/R", 2], ["adr", "ADR", 1],
  ["hs", "HS %", 0], ["k", "Kills", 1], ["d", "Muertes", 1], ["a", "Asist.", 1], ["mvp", "MVPs", 1],
];
const LOWER_IS_BETTER = { d: true };
function scopeMatches(p, scope = avgScope){
  return scope === "since" ? p.matches.filter(m => m.t && m.t >= START.getTime()) : p.matches;
}
function playerAvg(p, scope){
  const ms = scopeMatches(p, scope);
  const s = {
    n: ms.length, wr: ms.length ? ms.filter(m => m.win).length / ms.length * 100 : null,
    kd: avg(ms.map(m => m.kd)), kr: avg(ms.map(m => m.kr)), adr: avg(ms.map(m => m.adr)), hs: avg(ms.map(m => m.hs)),
    k: avg(ms.map(m => m.k)), d: avg(ms.map(m => m.d)), a: avg(ms.map(m => m.a)), mvp: avg(ms.map(m => m.mvp)),
  };
  if (scope === "hist" && p.life) {   // lo que FACEIT da de toda la carrera
    if (p.life.matches != null) s.n = p.life.matches;
    if (p.life.winrate != null) s.wr = p.life.winrate;
    if (p.life.kd != null) s.kd = p.life.kd;
    if (p.life.hs != null) s.hs = p.life.hs;
  }
  return s;
}
// Une las partidas de todos: una entrada por partida, con los del grupo que jugaron
function lobbies(){
  const map = new Map();
  players.filter(p => !p.error).forEach(p => scopeMatches(p).forEach(m => {
    if (!m.id) return;
    if (!map.has(m.id)) map.set(m.id, { id: m.id, map: m.map, score: m.score, t: m.t, who: [] });
    map.get(m.id).who.push({ p, m });
  }));
  return [...map.values()].map(L => {
    const wins = L.who.filter(x => x.m.win).length;
    L.win = wins * 2 >= L.who.length;
    L.top = L.who.slice().sort((a,b) => (b.m.k||0) - (a.m.k||0))[0];
    return L;
  }).sort((a,b) => (b.t||0) - (a.t||0));
}

function avgTable(id, title, note, empty){
  const srt = sorts[id];
  const rows = players.filter(p => !p.error).map(p => ({ p, s: playerAvg(p, id) })).filter(r => r.s.n > 0);
  const best = {}, worst = {};
  AVG_COLS.forEach(([k]) => {
    const vals = rows.map(r => r.s[k]).filter(v => v != null);
    if (vals.length < 2) return;
    const hi = Math.max(...vals), lo = Math.min(...vals);
    if (hi === lo) return;
    best[k] = LOWER_IS_BETTER[k] ? lo : hi;
    worst[k] = LOWER_IS_BETTER[k] ? hi : lo;
  });
  const k0 = srt.key;
  rows.sort((a,b) => ((b.s[k0] ?? -1e9) - (a.s[k0] ?? -1e9)) * (srt.dir < 0 ? 1 : -1));
  const head = AVG_COLS.map(([k, t], i) => `<th class="sort ${k0 === k ? "on" : ""} ${i > 5 ? "hide-m" : ""}" data-k="${k}">${t}${k0 === k ? (srt.dir < 0 ? " ▾" : " ▴") : ""}</th>`).join("");
  const cell = (r, k, d) => {
    const v = r.s[k];
    const txt = k === "wr" || k === "hs" ? (v == null ? "–" : fmt(v, d) + "%") : fmt(v, d);
    const cls = v == null ? "" : v === best[k] ? "best" : v === worst[k] ? "worst" : "";
    return [cls, txt];
  };
  const body = rows.map((r, i) => `<tr data-n="${esc(r.p.nick)}">
    <td class="pos">${i+1}</td>
    <td><div class="who"><img class="av" src="${esc(r.p.avatar || AV_FALLBACK)}" onerror="this.src='${AV_FALLBACK}'"><div class="nick">${esc(r.p.nick)}</div></div></td>
    ${AVG_COLS.map(([k,,d], j) => { const [c, t] = cell(r, k, d); return `<td class="${c} ${j > 5 ? "hide-m" : ""}">${t}</td>`; }).join("")}
  </tr>`).join("");
  return `<h3>${title}</h3>
    <div class="card scroll" data-tbl="${id}"><table>
      <thead><tr><th>#</th><th>Jugador</th>${head}</tr></thead>
      <tbody>${body || `<tr><td colspan="12" style="text-align:center;color:var(--muted)">${empty}</td></tr>`}</tbody>
    </table></div>
    <div class="foot" style="text-align:left">${note}</div>`;
}

function renderAvg(){
  const ok = players.filter(p => !p.error);
  const rows = ok.map(p => ({ p, s: playerAvg(p, avgScope === "since" ? "since" : "hist") })).filter(r => r.s.n > 0);
  const hoy = START.toLocaleDateString("es-UY", {day:"numeric", month:"long"});
  // ----- Equipo -----
  const all = lobbies();
  const group = all.filter(L => L.who.length >= 2);
  const gw = group.filter(L => L.win).length;
  const base = group.length ? group : all;
  const maps = {};
  base.forEach(L => { if (!L.map) return; const m = maps[L.map] ||= { n: 0, w: 0 }; m.n++; if (L.win) m.w++; });
  const mapRows = Object.entries(maps).map(([name, m]) => ({ name, ...m, wr: m.w / m.n * 100 }))
    .sort((a,b) => b.w - a.w || b.wr - a.wr);
  const tops = {};
  group.forEach(L => { const n = L.top.p.nick; tops[n] = (tops[n] || 0) + 1; });
  const topList = Object.entries(tops).sort((a,b) => b[1] - a[1]);
  const together = {};
  group.forEach(L => L.who.forEach(x => { const t = together[x.p.nick] ||= { n: 0, w: 0 }; t.n++; if (L.win) t.w++; }));
  const teamKd = avg(rows.map(r => r.s.kd)), teamAdr = avg(rows.map(r => r.s.adr)), teamHs = avg(rows.map(r => r.s.hs));
  const totalK = ok.reduce((s, p) => s + scopeMatches(p).reduce((a, m) => a + (m.k || 0), 0), 0);

  const teamStats = [
    ["Lobbies juntos", group.length],
    ["Lobbies ganados", group.length ? gw : "–"],
    ["% Vic. juntos", group.length ? fmt(gw / group.length * 100) + "%" : "–"],
    ["Partidas del grupo", all.length],
    ["K/D promedio", fmt(teamKd, 2)],
    ["ADR promedio", fmt(teamAdr, 1)],
    ["HS % promedio", teamHs == null ? "–" : fmt(teamHs) + "%"],
    ["Kills totales", totalK],
  ].map(([k,v]) => `<div class="card stat"><b>${v}</b><span>${k}</span></div>`).join("");

  $("#avg").innerHTML = `
    ${avgTable("since", "RANKING DE PROMEDIOS · DESDE HOY", "Arranca en cero el " + hoy + " y suma cada partida que juegan desde ahí.", "Todavía nadie jugó desde el " + hoy + ". Acá aparecen apenas terminen la primera partida.")}
    ${avgTable("hist", "RANKING DE PROMEDIOS · HISTÓRICO", "Partidas, % Vic., K/D y HS %: toda la carrera en FACEIT CS2. El resto: promedio de las últimas 100 partidas, porque FACEIT no da el histórico de esos datos.", "Sin datos.")}
    <div class="foot" style="text-align:left">Tocá el nombre de una columna para ordenar. En verde el mejor y en rojo el peor de cada estadística.</div>

    <div class="secrow"><h3>EQUIPO</h3>
      <div class="seg"><button data-s="since" class="${avgScope === "since" ? "on" : ""}">Desde hoy</button><button data-s="recent" class="${avgScope === "recent" ? "on" : ""}">Histórico</button></div>
    </div>
    <div class="grid">${teamStats}</div>

    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:start">
      <div>
        <h3 style="margin-top:0">MAPAS DEL GRUPO</h3>
        <div class="card scroll"><table>
          <thead><tr><th>Mapa</th><th>Ganados</th><th>Jugados</th><th>% Vic.</th></tr></thead>
          <tbody>${mapRows.map(m => `<tr><td>${esc(m.name)}</td><td>${m.w}</td><td>${m.n}</td><td>${fmt(m.wr)}%<span class="bar"><i style="width:${m.wr}%"></i></span></td></tr>`).join("") || '<tr><td colspan="4">Sin datos</td></tr>'}</tbody>
        </table></div>
        <div class="tag" style="margin-top:6px">${group.length ? "Solo lobbies donde jugaron 2 o más del grupo." : "Todavía no hay lobbies juntos: se muestran todas las partidas de todos."}</div>
      </div>
      <div>
        <h3 style="margin-top:0">JUGANDO JUNTOS</h3>
        <div class="card scroll"><table>
          <thead><tr><th>Jugador</th><th>Lobbies</th><th>% Vic.</th><th>Top fragger</th></tr></thead>
          <tbody>${Object.entries(together).sort((a,b) => b[1].n - a[1].n).map(([n, t]) => `<tr><td>${esc(n)}</td><td>${t.n}</td><td>${fmt(t.w / t.n * 100)}%</td><td>${tops[n] || 0}</td></tr>`).join("") || '<tr><td colspan="4">Sin lobbies juntos todavía</td></tr>'}</tbody>
        </table></div>
        <div class="tag" style="margin-top:6px">Top fragger: veces que fue el que más mató del grupo en el lobby.</div>
      </div>
    </div>

    <h3>ÚLTIMOS LOBBIES JUNTOS</h3>
    <div class="card scroll"><table>
      <thead><tr><th>Fecha</th><th>Mapa</th><th>Resultado</th><th>Jugaron</th><th class="hide-m">Top fragger</th></tr></thead>
      <tbody>${group.slice(0, 15).map(L => `<tr>
        <td>${L.t ? new Date(L.t).toLocaleDateString("es-UY",{day:"2-digit",month:"2-digit"}) : "–"}</td>
        <td><a href="https://www.faceit.com/es/cs2/room/${esc(L.id)}" target="_blank" rel="noopener">${esc(L.map)}</a></td>
        <td class="res ${L.win ? "w" : "l"}">${L.win ? "V" : "D"} <span style="color:var(--muted);font-weight:400">${esc(L.score)}</span></td>
        <td><span class="ppl">${L.who.map(x => `<img title="${esc(x.p.nick)}" src="${esc(x.p.avatar || AV_FALLBACK)}" onerror="this.src='${AV_FALLBACK}'">`).join("")}</span></td>
        <td class="hide-m">${esc(L.top.p.nick)} (${fmt(L.top.m.k)})</td>
      </tr>`).join("") || '<tr><td colspan="5">Sin lobbies juntos todavía</td></tr>'}</tbody>
    </table></div>`;

  document.querySelectorAll("#avg .seg button").forEach(b => b.onclick = () => { avgScope = b.dataset.s; renderAvg(); });
  document.querySelectorAll("#avg [data-tbl]").forEach(t => t.querySelectorAll("th.sort").forEach(th => th.onclick = () => {
    const id = t.dataset.tbl, k = th.dataset.k;
    sorts[id] = sorts[id].key === k ? { key: k, dir: -sorts[id].dir } : { key: k, dir: -1 };
    renderAvg();
  }));
  document.querySelectorAll("#avg tbody tr[data-n]").forEach(tr => tr.onclick = () => { selected = tr.dataset.n; renderPlayers(); show("players"); });
}

function gainCell(g){
  if (g == null) return '<span class="zero-g">–</span>';
  const c = g > 0 ? "pos-g" : g < 0 ? "neg-g" : "zero-g";
  return `<span class="gain ${c}">${g > 0 ? "+" : ""}${g}</span>`;
}
function formCell(ms){
  return `<span class="form">${ms.slice(0,5).reverse().map(m => `<i class="${m.win ? "w" : "l"}"></i>`).join("")}</span>`;
}

function renderRank(){
  const rows = players.map((p,i) => p.error ? `
    <tr><td class="pos">–</td><td><div class="who"><img class="av" src="${AV_FALLBACK}"><div><div class="nick">${esc(p.nick)}</div><div class="err">${esc(p.error)}</div></div></div></td><td colspan="7"></td></tr>` : `
    <tr data-n="${esc(p.nick)}">
      <td class="pos">${i+1}</td>
      <td><div class="who"><img class="av" src="${esc(p.avatar || AV_FALLBACK)}" onerror="this.src='${AV_FALLBACK}'"><div><div class="nick">${esc(p.nick)}</div></div></div></td>
      <td>${gainCell(p.gain)}</td>
      <td>${lvl(p.level)} ${fmt(p.elo)}</td>
      <td>${p.since.n}</td>
      <td class="hide-m">${p.since.n ? p.since.w + "-" + (p.since.n - p.since.w) : "–"}</td>
      <td class="hide-m">${fmt(p.since.n ? p.since.kd : p.recent.kd, 2)}</td>
      <td class="hide-m">${fmt(p.since.n ? p.since.adr : p.recent.adr, 1)}</td>
      <td class="hide-m">${formCell(p.matches)}</td>
    </tr>`).join("");
  $("#rank").innerHTML = `<div class="card scroll"><table>
    <thead><tr><th>#</th><th>Jugador</th><th>ELO ganado</th><th>ELO</th><th>Partidas</th><th class="hide-m">G-P</th><th class="hide-m">K/D</th><th class="hide-m">ADR</th><th class="hide-m">Últimas 5</th></tr></thead>
    <tbody>${rows}</tbody></table></div>
    <div class="foot">Partidas, G-P, K/D y ADR cuentan desde el inicio del ranking (si todavía no jugó, K/D y ADR son de sus últimas 20). Tocá un jugador para ver su perfil.</div>`;
  document.querySelectorAll("#rank tbody tr[data-n]").forEach(tr => tr.onclick = () => { selected = tr.dataset.n; renderPlayers(); show("players"); });
}

function renderPlayers(){
  const ok = players.filter(p => !p.error);
  const p = ok.find(x => x.nick === selected);
  const chips = ok.map(x => `<button class="chip ${x.nick === selected ? "on" : ""}" data-n="${esc(x.nick)}"><img src="${esc(x.avatar || AV_FALLBACK)}" onerror="this.src='${AV_FALLBACK}'">${esc(x.nick)}</button>`).join("");
  if (!p) { $("#players").innerHTML = `<div class="chips">${chips}</div>`; return; }
  const L = p.life;
  const stats = [
    ["ELO ganado", p.gain == null ? "–" : (p.gain > 0 ? "+" : "") + p.gain],
    ["ELO actual", fmt(p.elo)],
    ["Partidas totales", fmt(L.matches)],
    ["% Victorias", L.winrate == null ? "–" : fmt(L.winrate) + "%"],
    ["K/D", fmt(L.kd, 2)],
    ["HS %", L.hs == null ? "–" : fmt(L.hs) + "%"],
    ["ADR (últ. 20)", fmt(p.recent.adr, 1)],
    ["Racha actual", fmt(L.streak)],
    ["Mejor racha", fmt(L.longest)],
  ].map(([k,v]) => `<div class="card stat"><b>${v}</b><span>${k}</span></div>`).join("");
  const maps = p.maps.slice(0, 8).map(m => `<tr><td>${esc(m.name)}</td><td>${fmt(m.matches)}</td><td>${fmt(m.winrate)}%<span class="bar"><i style="width:${m.winrate||0}%"></i></span></td><td>${fmt(m.kd,2)}</td></tr>`).join("");
  const ms = p.matches.slice(0, 20).map(m => `<tr>
    <td>${m.t ? new Date(m.t).toLocaleDateString("es-UY",{day:"2-digit",month:"2-digit"}) : "–"}</td>
    <td><a href="https://www.faceit.com/es/cs2/room/${esc(m.id)}" target="_blank" rel="noopener">${esc(m.map)}</a></td>
    <td class="res ${m.win ? "w" : "l"}">${m.win ? "V" : "D"} <span style="color:var(--muted);font-weight:400">${esc(m.score)}</span></td>
    <td>${fmt(m.k)}-${fmt(m.d)}-${fmt(m.a)}</td>
    <td>${fmt(m.kd,2)}</td>
    <td class="hide-m">${fmt(m.adr,1)}</td>
    <td class="hide-m">${m.hs == null ? "–" : fmt(m.hs) + "%"}</td>
  </tr>`).join("");
  $("#players").innerHTML = `
    <div class="chips">${chips}</div>
    <div class="card phead">
      <img class="av" src="${esc(p.avatar || AV_FALLBACK)}" onerror="this.src='${AV_FALLBACK}'">
      <div><h2>${esc(p.nick)} ${lvl(p.level)}</h2><a href="https://www.faceit.com/es/players/${encodeURIComponent(p.nick)}" target="_blank" rel="noopener">Ver perfil en FACEIT ↗</a></div>
    </div>
    <div class="grid">${stats}</div>
    <h3>MAPAS</h3>
    <div class="card scroll"><table><thead><tr><th>Mapa</th><th>Partidas</th><th>% Victorias</th><th>K/D</th></tr></thead><tbody>${maps || '<tr><td colspan="4">Sin datos</td></tr>'}</tbody></table></div>
    <h3>ÚLTIMAS PARTIDAS</h3>
    <div class="card scroll"><table><thead><tr><th>Fecha</th><th>Mapa</th><th>Resultado</th><th>K-D-A</th><th>K/D</th><th class="hide-m">ADR</th><th class="hide-m">HS</th></tr></thead><tbody>${ms || '<tr><td colspan="7">Sin partidas</td></tr>'}</tbody></table></div>`;
  document.querySelectorAll("#players .chip").forEach(c => c.onclick = () => { selected = c.dataset.n; renderPlayers(); });
}

function show(t){
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.t === t));
  ["avg","rank","players"].forEach(id => $("#" + id).hidden = id !== t);
  window.scrollTo(0, 0);
}
document.querySelectorAll(".tab").forEach(b => b.onclick = () => show(b.dataset.t));
$("#reload").onclick = loadAll;
loadAll();
</script>
</body>
</html>
